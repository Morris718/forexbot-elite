{% extends "base.html" %}
{% block title %}Withdraw - Forex Bot Pro{% endblock %}
{% block content %}
<div style="max-width:450px;margin:0 auto;">
    <div class="card">
        <h2 style="color:var(--text-primary);margin-bottom:1.5rem;text-align:center;">
            <i class="fas fa-minus-circle" style="color:var(--accent-red);"></i> Withdraw Funds
        </h2>
        <div style="text-align:center;margin-bottom:1.5rem;padding:1rem;background:rgba(16,185,129,0.1);border-radius:8px;">
            <div style="color:var(--text-secondary);">Available Balance</div>
            <div style="font-size:2rem;font-weight:700;color:var(--accent-green);">${{ "%.2f"|format(balance) }}</div>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Amount ($)</label>
                <input type="number" name="amount" step="0.01" min="10" max="{{ balance }}" class="form-control" placeholder="100.00" required>
            </div>
            <button type="submit" class="btn btn-danger" style="width:100%;">Withdraw</button>
        </form>
        <a href="{{ url_for('wallet.index') }}" class="btn btn-outline" style="width:100%;margin-top:1rem;">Cancel</a>
    </div>
</div>
{% endblock %}
