<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login - ForexBot Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-messages" style="padding:12px 20px 0;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for category, message in messages %}
    <div class="alert alert-{{ category }}">
      <i class="fas fa-info-circle"></i> {{ message }}
      <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}{% endif %}
  {% endwith %}
</div>
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <i class="fas fa-coins"></i>
      <h1>ForexBot Pro</h1>
      <p>Sign in to your trading account</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-prefix"></i>
          <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-prefix"></i>
          <input type="password" name="password" id="password" class="form-control" placeholder="Your password" required>
          <button type="button" class="eye-btn" onclick="togglePassword('password')">
            <i class="fas fa-eye" id="password-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create Account</a>
    </div>
  </div>
</div>
<script>
  function togglePassword(id) {
    const inp = document.getElementById(id); const eye = document.getElementById(id+"-eye");
    if(inp.type==="password"){inp.type="text";eye.classList.replace("fa-eye","fa-eye-slash");}
    else{inp.type="password";eye.classList.replace("fa-eye-slash","fa-eye");}
  }
</script>
</body>
</html>
